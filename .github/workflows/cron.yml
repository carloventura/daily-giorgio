name: Insta to Discord Channel
on:
  schedule:
    - cron: '5 8-20/3 * * *'
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Pubblica comunque l'ultimo post (solo avvio manuale)"
        required: true
        default: false
        type: boolean

jobs:
  check-insta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ripristina Memoria (Cache)
        uses: actions/cache@v3
        with:
          path: last_post.txt
          key: insta-cache-${{ github.run_id }}
          restore-keys: insta-cache-

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Esegui Script
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          RSS_URL: ${{ secrets.RSS_URL }}
          FORCE_PUBLISH: ${{ inputs.force_publish || 'false' }}
        run: python script.py
